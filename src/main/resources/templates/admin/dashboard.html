<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <title>Báo cáo thống kê</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>

        body {
            background: #f4f6f9;
        }

        .sidebar {
            height: 100vh;
            background: #343a40;

            position: fixed;
            top: 0;
            left: 0;

            width: 16.666667%; /* tương đương col-md-2 */
            overflow-y: auto;
        }

        .sidebar a {
            color: white;
            display: block;
            padding: 12px 20px;
        }

        .sidebar a:hover {
            background: #495057;
            text-decoration: none;
        }

        .page-title {
            font-weight: 700;
            color: #343a40;
        }

        .stat-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .main-content {
            margin-left: 16.666667%;
        }

    </style>

</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-0">
            <h4 class="text-center py-3 text-white">
                ADMIN SYSTEM
            </h4>

            <a th:href="@{/admin}">
                <i class="fa fa-home"></i> Trang chủ
            </a>

            <a th:href="@{/admin/users}">
                <i class="fa fa-users"></i> Quản lý người dùng
            </a>

            <a th:href="@{/admin/buses}">
                <i class="fa fa-bus"></i> Quản lý xe
            </a>

            <a th:href="@{/admin/drivers}">
                <i class="fa fa-id-card"></i> Quản lý tài xế
            </a>

            <a th:href="@{/admin/trips}">
                <i class="fa fa-route"></i> Quản lý chuyến đi
            </a>

            <a th:href="@{/admin/dashboard}" class="bg-secondary">
                <i class="fa fa-chart-bar"></i> Báo cáo thống kê
            </a>

            <a href="/logout">
                <i class="fa fa-sign-out-alt"></i> Đăng xuất
            </a>

        </div>

        <!-- MAIN -->
        <div class="col-md-10 p-4 main-content">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="page-title mb-0">
                    <i class="fa fa-chart-bar"></i>
                    Báo cáo thống kê
                </h3>

                <div>
                    👤
                    <span th:text="${#strings.capitalize(session.USER.username)}"></span>
                </div>

            </div>

            <!-- STATS -->
            <div class="row mb-4">

                <div class="col-md-4">
                    <div class="card stat-card p-3 text-center">
                        <h5>Doanh thu tháng này</h5>
                        <h3 class="text-success"
                            th:text="${#numbers.formatDecimal(
                                    revenueByMonth.isEmpty() ? 0 : revenueByMonth[revenueByMonth.size()-1].revenue,
                                    0, 'COMMA', 0, 'POINT'
                                )} + ' đ'">
                        </h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card p-3 text-center">
                        <h5>Tuyến hot nhất</h5>
                        <h3 class="text-primary"
                            th:text="${revenueByRoute.isEmpty() ? 'N/A' : revenueByRoute[0].routeName}">
                        </h3>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card stat-card p-3 text-center">
                        <h5>Chuyến nhiều vé nhất</h5>
                        <h3 class="text-danger"
                            th:text="${topTrips.isEmpty() ? 'N/A' : topTrips[0].routeName}">
                        </h3>
                    </div>
                </div>

            </div>

            <!-- CHARTS -->
            <div class="row">

                <div class="col-md-6 mb-4">
                    <div class="card p-3 shadow-sm">
                        <h5>📅 Doanh thu theo tháng</h5>
                        <canvas id="monthChart"></canvas>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="card p-3 shadow-sm">
                        <h5>🛣 Doanh thu theo tuyến</h5>
                        <canvas id="routeChart"></canvas>
                    </div>
                </div>

            </div>

            <!-- TABLE -->
            <div class="card p-3 shadow-sm">

                <h5>🏆 Top 5 chuyến phổ biến</h5>

                <table class="table table-hover mt-3">

                    <thead>
                    <tr>
                        <th>Chuyến</th>
                        <th>Lượt đặt</th>
                        <th>Doanh thu</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="t : ${topTrips}">
                        <td th:text="${t.routeName}"></td>
                        <td th:text="${t.totalTickets}"></td>
                        <td class="text-danger font-weight-bold"
                            th:text="${#numbers.formatDecimal(t.revenue, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script th:inline="javascript">

    const revenueByMonth = /*[[${revenueByMonth}]]*/ [];
    const revenueByRoute = /*[[${revenueByRoute}]]*/ [];

    const monthLabels = revenueByMonth.map(r => r.month);
    const monthData   = revenueByMonth.map(r => r.revenue);

    const routeLabels = revenueByRoute.map(r => r.routeName);
    const routeData   = revenueByRoute.map(r => r.revenue);

    new Chart(document.getElementById('monthChart'), {
        type: 'line',
        data: {
            labels: monthLabels,
            datasets: [{
                label: 'Doanh thu (đ)',
                data: monthData,
                borderColor: '#28a745',
                backgroundColor: 'rgba(40,167,69,0.1)',
                borderWidth: 3,
                tension: 0.3
            }]
        },
        options: {
            plugins: { legend: { display: false } }
        }
    });

    new Chart(document.getElementById('routeChart'), {
        type: 'bar',
        data: {
            labels: routeLabels,
            datasets: [{
                label: 'Doanh thu (đ)',
                data: routeData,
                backgroundColor: '#007bff'
            }]
        },
        options: {
            plugins: { legend: { display: false } }
        }
    });

</script>

</body>
</html>
