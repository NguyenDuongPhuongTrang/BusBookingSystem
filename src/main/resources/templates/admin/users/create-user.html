<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Tạo tài khoản</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 4 -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #f5f6fa;
        }

        .card {
            border-radius: 12px;
        }
    </style>
</head>

<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body">

                    <h4 class="text-center mb-4">Tạo tài khoản</h4>

                    <!-- SUCCESS -->
                    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

                    <form th:action="@{/admin/create-user}" th:object="${req}" method="post">

                        <!-- USERNAME -->
                        <div class="form-group">
                            <label>Username</label>
                            <input class="form-control" th:field="*{username}">
                            <small class="text-danger" th:errors="*{username}"></small>
                        </div>

                        <!-- PASSWORD -->
                        <div class="form-group">
                            <label>Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" th:field="*{password}" id="password">
                                <div class="input-group-append">
                            <span class="input-group-text toggle-password" onclick="togglePassword('password','eye1')">
                                <i class="fa fa-eye" id="eye1"></i>
                            </span>
                                </div>
                            </div>
                            <small class="text-danger" th:errors="*{password}"></small>
                        </div>

                        <!-- CONFIRM PASSWORD -->
                        <div class="form-group">
                            <label>Confirm Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control" th:field="*{confirmPassword}" id="confirmPassword">
                                <div class="input-group-append">
                            <span class="input-group-text toggle-password" onclick="togglePassword('confirmPassword','eye2')">
                                <i class="fa fa-eye" id="eye2"></i>
                            </span>
                                </div>
                            </div>
                            <small class="text-danger" th:errors="*{confirmPassword}"></small>
                        </div>

                        <!-- FULL NAME -->
                        <div class="form-group">
                            <label>Họ tên</label>
                            <input class="form-control" th:field="*{fullName}">
                            <small class="text-danger" th:errors="*{fullName}"></small>
                        </div>

                        <!-- PHONE -->
                        <div class="form-group">
                            <label>Số điện thoại</label>
                            <input class="form-control" th:field="*{phone}">
                            <small class="text-danger" th:errors="*{phone}"></small>
                        </div>

                        <!-- EMAIL -->
                        <div class="form-group">
                            <label>Email</label>
                            <input class="form-control" th:field="*{email}">
                            <small class="text-danger" th:errors="*{email}"></small>
                        </div>

                        <!-- ADDRESS -->
                        <div class="form-group">
                            <label>Địa chỉ</label>
                            <input class="form-control" th:field="*{address}">
                            <small class="text-danger" th:errors="*{address}"></small>
                        </div>

                        <!-- ROLE -->
                        <div class="form-group">
                            <label>Role</label>
                            <select class="form-control" th:field="*{role}">
                                <option value="">-- Chọn role --</option>
                                <option th:each="r : ${roles}"
                                        th:value="${r}"
                                        th:text="${r}">
                                </option>
                            </select>
                            <small class="text-danger" th:errors="*{role}"></small>
                        </div>

                        <!-- BUTTON -->
                        <button class="btn btn-primary btn-block mt-3">
                            Tạo tài khoản
                        </button>

                        <!-- BACK -->
                        <a th:href="@{/admin/users}"  class="btn btn-secondary btn-block mt-2">
                            Quay lại
                        </a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- JS -->
<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>
</body>
</html>
