<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Quản lý người dùng</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body{
            background:#f4f6f9;
        }

        /* SIDEBAR */
        .sidebar{
            height:100vh;
            background:#343a40;
        }

        .sidebar a{
            color:white;
            display:block;
            padding:12px 20px;
            transition:0.2s;
        }

        .sidebar a:hover{
            background:#495057;
            text-decoration:none;
        }

        /* CARD */
        .card{
            border:none;
            border-radius:15px;
            overflow:hidden;
        }

        .page-title{
            font-weight:700;
            color:#343a40;
        }

        .table{
            margin-bottom:0;
        }

        .table thead{
            background:#343a40;
            color:white;
        }

        .table thead th{
            border:none;
            padding:15px;
            vertical-align:middle;
        }

        .table tbody td{
            vertical-align:middle;
            padding:14px;
        }

        .table tbody tr:hover{
            background:#f8f9fa;
            transition:0.2s;
        }

        .btn{
            border-radius:10px;
            font-weight:500;
        }

        .badge{
            padding:7px 12px;
            border-radius:20px;
            font-size:13px;
        }

        .form-control{
            border-radius:10px;
            height:45px;
        }

        .form-control:focus{
            box-shadow:none;
        }

        .table-responsive{
            border-radius:15px;
        }

    </style>
</head>

<body>
<div class="container-fluid">
    <div class="row">
        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-0">
            <h4 class="text-center py-3 text-white">ADMIN SYSTEM</h4>

            <a th:href="@{/admin}">
                <i class="fa fa-home"></i> Trang chủ
            </a>

            <a th:href="@{/admin/users}" class="bg-secondary">
                <i class="fa fa-users"></i> Quản lý người dùng
            </a>

            <a th:href="@{/admin/buses}">
                <i class="fa fa-bus"></i> Quản lý xe
            </a>

            <a th:href="@{/admin/drivers}">
                <i class="fa fa-bus"></i> Quản lý tài xế
            </a>

            <a th:href="@{/admin/trips}">
                <i class="fa fa-route"></i> Quản lý chuyến đi
            </a>

            <a href="/logout">
                <i class="fa fa-sign-out-alt"></i> Đăng xuất
            </a>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-10 p-4">
            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="page-title mb-0">
                    <i class="fa fa-users"></i> &nbsp;Quản lý người dùng
                </h3>

                <div>
                    👤
                    <span th:text="${#strings.capitalize(session.USER.username)}">
                    </span>
                </div>
            </div>

            <!-- ALERT -->
            <div th:if="${success}"
                 class="alert alert-success shadow-sm"
                 th:text="${success}">
            </div>

            <div th:if="${error}"
                 class="alert alert-danger shadow-sm"
                 th:text="${error}">
            </div>

            <!-- SEARCH -->
            <div class="card shadow-sm mb-4">
                <div class="card-body d-flex justify-content-between">
                    <form method="get" th:action="@{/admin/users}">
                        <div class="input-group">
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm username...">
                            <div class="input-group-append">
                                <button class="btn btn-primary">
                                    <i class="fa fa-search"></i>&nbsp;Tìm kiếm
                                </button>
                            </div>
                        </div>
                    </form>
                    <a th:href="@{/admin/create-user}" class="btn btn-primary mt-1">
                        <i class="fa fa-plus"></i>&nbsp;Tạo ngay
                    </a>
                </div>
            </div>

            <!-- TABLE -->
            <div class="card shadow">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover text-center">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Role</th>
                                <th>Trạng thái</th>
                                <th>Ngày tạo</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="user : ${users}">
                                <td th:text="${user.id}"></td>
                                <td class="font-weight-bold" th:text="${user.username}"></td>
                                <td>
                                    <span th:if="${user.role.name() == 'STAFF'}" class="badge badge-warning">
                                        STAFF
                                    </span>

                                    <span th:if="${user.role.name() == 'PASSENGER'}" class="badge badge-info">
                                        PASSENGER
                                    </span>

                                    <span th:if="${user.role.name() == 'ADMIN'}" class="badge badge-danger">
                                        ADMIN
                                    </span>
                                </td>
                                <td>
                                    <span th:if="${user.enabled}" class="badge badge-success">
                                        Hoạt động
                                    </span>

                                    <span th:unless="${user.enabled}" class="badge badge-secondary">
                                        Đã khóa
                                    </span>
                                </td>
                                <td th:text="${#temporals.format(user.createdAt,'dd/MM/yyyy HH:mm')}"></td>
                                <td>
                                    <a th:href="@{/admin/users/toggle/{id}(id=${user.id})}"
                                       th:classappend="${user.enabled}
                                       ? 'btn-danger'
                                       : 'btn-success'"
                                       class="btn btn-sm">
                                        <span th:if="${user.enabled}">
                                            <i class="fa fa-lock"></i>&nbsp;Khóa
                                        </span>
                                        <span th:unless="${user.enabled}">
                                            <i class="fa fa-unlock"></i>&nbsp;Mở khóa
                                        </span>
                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>

</html>
