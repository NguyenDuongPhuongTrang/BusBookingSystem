<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Cập nhật xe</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body{
            background: #f4f6f9;
            min-height: 100vh;
        }

        .card{
            border: none;
            border-radius: 18px;
            overflow: hidden;
        }

        .card-header{
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            padding: 20px;
            border: none;
        }

        .card-header h3{
            margin: 0;
            font-weight: 700;
        }

        .card-body{
            padding: 35px;
        }

        .form-control{
            border-radius: 10px;
            height: 45px;
        }

        .form-control:focus{
            box-shadow: none;
            border-color: #007bff;
        }

        label{
            font-weight: 600;
            color: #343a40;
        }

        .btn{
            border-radius: 10px;
            padding: 10px 20px;
            font-weight: 600;
        }

        .text-danger{
            font-size: 14px;
        }

        .form-group{
            margin-bottom: 22px;
        }
    </style>
</head>

<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card shadow-lg">

                <!-- HEADER -->
                <div class="card-header">
                    <h3>
                        <i class="fa fa-bus"></i>&nbsp;Cập nhật xe
                    </h3>
                </div>

                <!-- BODY -->
                <div class="card-body">
                    <form th:action="@{/admin/buses/edit}" method="post" th:object="${busDTO}">

                        <input type="hidden" th:field="*{id}">

                        <!-- LICENSE -->
                        <div class="form-group">
                            <label>
                                <i class="fa fa-id-card"></i>&nbsp;Biển số xe
                            </label>
                            <input type="text" th:field="*{licensePlate}" class="form-control" placeholder="VD: 29A-123.45">
                            <small class="text-danger" th:errors="*{licensePlate}"></small>
                        </div>

                        <!-- BUS TYPE -->
                        <div class="form-group">
                            <label>
                                <i class="fa fa-bus"></i>&nbsp;Loại xe
                            </label>
                            <input type="text" th:field="*{busType}" class="form-control" placeholder="VD: Limousine">
                            <small class="text-danger" th:errors="*{busType}"></small>
                        </div>

                        <!-- TOTAL SEATS -->
                        <div class="form-group">
                            <label>
                                <i class="fa fa-chair"></i>&nbsp;Số ghế
                            </label>
                            <input type="number" th:field="*{totalSeats}" class="form-control" placeholder="Nhập số ghế">
                            <small class="text-danger" th:errors="*{totalSeats}"></small>
                        </div>

                        <!-- COMPANY -->
                        <div class="form-group">
                            <label>
                                <i class="fa fa-building"></i>&nbsp;Nhà xe
                            </label>
                            <input type="text" th:field="*{companyName}" class="form-control" placeholder="Tên nhà xe">
                            <small class="text-danger" th:errors="*{companyName}"></small>
                        </div>

                        <!-- DRIVER -->
                        <div class="form-group">
                            <label>
                                <i class="fa fa-user"></i>&nbsp;Tài xế
                            </label>

                            <select th:field="*{driverId}"
                                    class="form-control">

                                <option value="">
                                    -- Chọn tài xế --
                                </option>

                                <option th:each="driver : ${drivers}"
                                        th:value="${driver.id}"
                                        th:text="${driver.fullName + ' - ' + driver.phone}">
                                </option>

                            </select>

                            <small class="text-danger"
                                   th:errors="*{driverId}">
                            </small>
                        </div>

                        <!-- BUTTON -->
                        <div class="d-flex justify-content-between mt-4">
                            <a th:href="@{/admin/buses}"
                               class="btn btn-outline-secondary">
                                <i class="fa fa-arrow-left"></i>&nbsp;Quay lại
                            </a>

                            <button class="btn btn-warning">
                                Cập nhật
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
