<!doctype html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Quản lý xe</title>

    <!-- Bootstrap -->
    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <!-- FontAwesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        body{
            background:#f4f6f9;
        }

        .sidebar{
            height:100vh;
            background:#343a40;
        }

        .sidebar a{
            color:white;
            display:block;
            padding:12px 20px;
        }

        .sidebar a:hover{
            background:#495057;
            text-decoration:none;
        }

        .card{
            border:none;
            border-radius:15px;
            overflow:hidden;
        }

        .page-title{
            font-weight:700;
            color:#343a40;
        }

        .btn{
            border-radius:10px;
            font-weight:500;
        }
        /* PAGINATION STYLE - UNIFIED */
        .pagination {
            margin-top: 20px;
        }

        .pagination .page-item {
            margin: 0 4px;
        }

        .pagination .page-link {
            border: none;
            border-radius: 10px;
            padding: 8px 14px;
            color: #343a40;
            background: #fff;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            transition: all 0.2s ease;
        }

        .pagination .page-link:hover {
            background: #343a40;
            color: #fff;
            transform: translateY(-1px);
        }

        .pagination .active .page-link {
            background: #343a40;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .pagination .disabled .page-link {
            opacity: 0.5;
            pointer-events: none;
            background: #f1f1f1;
        }
    </style>
</head>

<body style="background:#f4f6f9;">
<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar p-0">
            <h4 class="text-center py-3 text-white">ADMIN SYSTEM</h4>

            <a th:href="@{/admin}">
                <i class="fa fa-home"></i> Trang chủ
            </a>

            <a th:href="@{/admin/users}">
                <i class="fa fa-users"></i> Quản lý người dùng
            </a>

            <a th:href="@{/admin/buses}" class="bg-secondary">
                <i class="fa fa-bus"></i> Quản lý xe
            </a>

            <a th:href="@{/admin/drivers}">
                <i class="fa fa-bus"></i> Quản lý tài xế
            </a>

            <a th:href="@{/admin/trips}">
                <i class="fa fa-route"></i> Quản lý chuyến đi
            </a>

            <a th:href="@{/admin/dashboard}" >
                <i class="fa fa-chart-bar"></i> Báo cáo thống kê
            </a>

            <a href="/logout">
                <i class="fa fa-sign-out-alt"></i> Đăng xuất
            </a>
        </div>

        <!-- MAIN CONTENT -->
        <div class="col-md-10 p-4">
            <!-- HEADER -->
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="page-title mb-0">
                    <i class="fa fa-bus"></i> &nbsp;Quản lý xe
                </h3>

                <div>
                    👤
                    <span th:text="${#strings.capitalize(session.USER.username)}">
                    </span>
                </div>
            </div>

            <!-- ACTION -->
            <div class="mb-3 d-flex justify-content-end">
                <a th:href="@{/admin/buses/create}" class="btn btn-primary shadow-sm">
                    <i class="fa fa-plus"></i>
                    Thêm xe
                </a>
            </div>

            <!-- SUCCESS -->
            <div th:if="${success}"
                 class="alert alert-success shadow-sm"
                 th:text="${success}">
            </div>

            <!-- TABLE -->
            <div class="card shadow">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover text-center">
                            <thead class="thead-dark">
                            <tr>
                                <th>ID</th>
                                <th>Biển số</th>
                                <th>Loại xe</th>
                                <th>Số ghế</th>
                                <th>Nhà xe</th>
                                <th>Tài xế</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="bus : ${busPage.content}">
                                <td th:text="${bus.id}"></td>
                                <td class="font-weight-bold"
                                    th:text="${bus.licensePlate}">
                                </td>
                                <td th:text="${bus.busType}"></td>
                                <td>
                                    <span class="badge badge-info px-3 py-2"
                                          th:text="${bus.totalSeats + ' ghế'}">
                                    </span>
                                </td>
                                <td th:text="${bus.companyName}"></td>
                                <td th:text="${bus.driver.fullName}"></td>
                                <td>
                                    <a th:href="@{/admin/buses/edit/{id}(id=${bus.id})}"
                                       class="btn btn-warning btn-sm">

                                        <i class="fa fa-edit"></i>
                                    </a>

                                    <!-- TOGGLE -->
                                    <a th:href="@{/admin/buses/toggle/{id}(id=${bus.id})}"
                                       class="btn btn-sm"

                                       th:classappend="${bus.active}? 'btn-secondary': 'btn-success'">

                                        <i class="fa"
                                           th:classappend="${bus.active}? ' fa-lock': ' fa-lock-open'">
                                        </i>

                                    </a>
                                </td>
                            </tr>
                            </tbody>
                        </table>

                        <!-- PAGINATION -->
                        <div class="d-flex justify-content-center mt-4">
                            <ul class="pagination">
                                <!-- PREVIOUS -->
                                <li class="page-item"
                                    th:classappend="${busPage.first} ? 'disabled'">

                                    <a class="page-link"
                                       th:href="@{/admin/buses(page=${busPage.number - 1})}">
                                        Previous
                                    </a>
                                </li>

                                <!-- PAGE NUMBER -->
                                <li class="page-item"
                                    th:each="i : ${#numbers.sequence(0, busPage.totalPages - 1)}"
                                    th:classappend="${i == busPage.number} ? 'active'">

                                    <a class="page-link"
                                       th:text="${i + 1}"
                                       th:href="@{/admin/buses(page=${i})}">
                                    </a>
                                </li>

                                <!-- NEXT -->
                                <li class="page-item"
                                    th:classappend="${busPage.last} ? 'disabled'">

                                    <a class="page-link"
                                       th:href="@{/admin/buses(page=${busPage.number + 1})}">
                                        Next
                                    </a>
                                </li>

                            </ul>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!--JS-->
<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</body>
</html>
