<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Đổi mật khẩu</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<section layout:fragment="content">

    <style>
        .change-wrapper {
            max-width: 600px;
            margin: auto;
        }

        .change-card {
            border: none;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            background: #ffffff;
        }

        .change-title {
            font-weight: 700;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .form-control {
            border-radius: 10px;
            height: 45px;
        }

        .btn-change {
            width: 100%;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border: none;
        }

        .change-avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #dc3545;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            margin: auto;
            margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(220,53,69,0.3);
        }

        .text-danger {
            font-size: 13px;
            margin-top: 5px;
            display: block;
        }

        .is-invalid {
            border: 1px solid #dc3545 !important;
        }

        .input-group-text {
            cursor: pointer;
            background: #fff;
        }
    </style>

    <div class="change-wrapper">
        <div class="change-card">

            <div class="change-avatar">🔒</div>

            <h3 class="text-center change-title">Đổi mật khẩu</h3>

            <!-- SUCCESS MESSAGE -->
            <div class="alert alert-success"
                 th:if="${successMessage}"
                 th:text="${successMessage}">
            </div>

            <form th:action="@{/profile/change-password}"
                  th:object="${passwordDTO}"
                  method="post">

                <!-- OLD PASSWORD -->
                <div class="form-group">
                    <label>Mật khẩu cũ</label>

                    <div class="input-group">
                        <input type="password"
                               id="oldPassword"
                               th:field="*{oldPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('oldPassword')} ? 'is-invalid'">

                        <div class="input-group-append">
                            <span class="input-group-text"
                                  onclick="togglePassword('oldPassword','eyeOld')">
                                <i class="fa fa-eye" id="eyeOld"></i>
                            </span>
                        </div>
                    </div>

                    <span class="text-danger"
                          th:if="${#fields.hasErrors('oldPassword')}"
                          th:errors="*{oldPassword}">
                    </span>
                </div>

                <!-- NEW PASSWORD -->
                <div class="form-group">
                    <label>Mật khẩu mới</label>

                    <div class="input-group">
                        <input type="password"
                               id="newPassword"
                               th:field="*{newPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'">

                        <div class="input-group-append">
                            <span class="input-group-text"
                                  onclick="togglePassword('newPassword','eyeNew')">
                                <i class="fa fa-eye" id="eyeNew"></i>
                            </span>
                        </div>
                    </div>

                    <span class="text-danger"
                          th:if="${#fields.hasErrors('newPassword')}"
                          th:errors="*{newPassword}">
                    </span>
                </div>

                <!-- CONFIRM PASSWORD -->
                <div class="form-group">
                    <label>Xác nhận mật khẩu</label>

                    <div class="input-group">
                        <input type="password"
                               id="confirmPassword"
                               th:field="*{confirmPassword}"
                               class="form-control"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">

                        <div class="input-group-append">
                            <span class="input-group-text"
                                  onclick="togglePassword('confirmPassword','eyeConfirm')">
                                <i class="fa fa-eye" id="eyeConfirm"></i>
                            </span>
                        </div>
                    </div>

                    <span class="text-danger"
                          th:if="${#fields.hasErrors('confirmPassword')}"
                          th:errors="*{confirmPassword}">
                    </span>
                </div>

                <button type="submit" class="btn btn-primary btn-change mt-3">
                    Cập nhật mật khẩu
                </button>

            </form>
        </div>
    </div>
</section>

<!-- JS TOGGLE PASSWORD -->
<script>
    function togglePassword(inputId, iconId) {
        const input = document.getElementById(inputId);
        const icon = document.getElementById(iconId);

        if (input.type === "password") {
            input.type = "text";
            icon.classList.remove("fa-eye");
            icon.classList.add("fa-eye-slash");
        } else {
            input.type = "password";
            icon.classList.remove("fa-eye-slash");
            icon.classList.add("fa-eye");
        }
    }
</script>
<th:block layout:fragment="scripts">
    <script>
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === "password") {
                input.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }
    </script>
</th:block>
</body>
</html>
