<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">

<head>
    <title>Thông tin cá nhân</title>
</head>

<body>
<section layout:fragment="content">

    <style>
        .profile-wrapper { max-width: 700px; margin: auto; }
        .profile-card {
            border: none;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            background: #ffffff;
        }
        .profile-title { font-weight: 700; margin-bottom: 25px; color: #2c3e50; }
        .form-control { border-radius: 10px; height: 45px; }
        .btn-save {
            width: 100%;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            background: linear-gradient(135deg, #007bff, #00c6ff);
            border: none;
        }
        .profile-avatar {
            width: 90px; height: 90px; border-radius: 50%;
            background: #007bff; color: white;
            display: flex; align-items: center; justify-content: center;
            font-size: 35px; margin: auto; margin-bottom: 20px;
            box-shadow: 0 8px 20px rgba(0,123,255,0.3);
        }
    </style>

    <div class="profile-wrapper">
        <div class="profile-card">
            <div class="profile-avatar">👤</div>
            <h3 class="text-center profile-title">Thông tin cá nhân</h3>

            <!-- SUCCESS -->
            <div class="alert alert-success"
                 th:if="${successMessage}"
                 th:text="${successMessage}">
            </div>

            <form th:action="@{/profile/update}" method="post">
                <div class="form-group">
                    <label>Họ tên</label>
                    <input class="form-control" name="fullName" th:value="${profile?.fullName}">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input class="form-control" name="phone" th:value="${profile?.phone}">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input class="form-control" name="email" th:value="${profile?.email}">
                </div>
                <div class="form-group">
                    <label>Địa chỉ</label>
                    <input class="form-control" name="address" th:value="${profile?.address}">
                </div>

                <button type="submit" class="btn btn-primary btn-save mt-3">
                    Cập nhật thông tin
                </button>
            </form>
        </div>
    </div>

</section>
</body>
</html>
